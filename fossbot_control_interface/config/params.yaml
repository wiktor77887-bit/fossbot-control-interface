# Parameters for the nodes of fossbot_control_interface.
# Loaded by launch/interface.launch.py (override with params_file:=<path>).

click_teleop:
  ros__parameters:
    image_topic: /camera/image_raw     # robot camera shown in the click window
    cmd_vel_topic: /cmd_vel
    max_linear_speed: 0.2              # [m/s] at the top/bottom edge of the window
    min_linear_speed: 0.05             # [m/s] just outside the dead zone
    dead_zone: 0.05                    # fraction of half-height ignored around the centre line
    proportional_speed: true           # false = always max_linear_speed
    move_duration: 1.0                 # [s] how long one click drives the robot
    publish_rate: 20.0                 # [Hz] real FOSSBot stops after 0.5 s without /cmd_vel
    window_width: 640
    window_height: 480
    enable_motors_on_start: false      # set by the launch file (use_real_robot:=true)

gesture_control:
  # THREE (index + middle + ring) = 360 deg left, HORNS (index + pinky) = 360 deg
  # right, open PALM = abort. Thumb ignored; see gesture_logic.py.
  ros__parameters:
    image_topic: /user_cam/image_raw   # camera that sees the user's hand
    cmd_vel_topic: /cmd_vel
    odom_topic: /odom                  # yaw feedback: the rotation is closed-loop
    model_path: ~/hand_landmarker.task # MediaPipe hand landmarker model
    max_angular_speed: 0.8             # [rad/s]
    min_angular_speed: 0.2             # [rad/s] reached at the very end of the turn
    slow_zone: 0.6                     # [rad] slow down over the last ~35 deg
    angle_tolerance: 0.02              # [rad] stop when this close to 360 deg
    hold_frames: 5                     # frames a gesture must be held to trigger
    finger_ratio: 1.2                  # tip/PIP distance from the wrist for "extended";
                                       # raise it if a half-bent pinky breaks THREE
    publish_rate: 20.0                 # [Hz] real FOSSBot stops after 0.5 s without /cmd_vel
    odom_timeout: 0.5                  # [s] abort when /odom goes silent
    rotation_timeout: 30.0             # [s] abort a rotation that takes too long
    show_window: true                  # preview with the hand skeleton
    mirror_preview: true               # selfie view in the preview window
    enable_motors_on_start: false      # set by the launch file (use_real_robot:=true)

dashboard:
  ros__parameters:
    odom_topic: /odom
    cmd_vel_topic: /cmd_vel
    image_topic: /camera/image_raw     # robot camera
    history: 20.0                      # [s] time span of the velocity plots
    refresh_rate: 10.0                 # [Hz] GUI refresh; keep low on laptops without a GPU
    image_scale: 0.5                   # camera image is downsampled before drawing
    trajectory_min_step: 0.01          # [m] store a path point only after moving this far
    trajectory_max_points: 5000
