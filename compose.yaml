# FOSSBot control interface in Docker: a driver container (robot driver + laptop
# camera, docker/Dockerfile.drivers) and an interface container with the
# project's own nodes (docker/Dockerfile). Use exactly ONE profile:
#
#   docker compose --profile sim up     # Gazebo simulation + camera | interface
#   docker compose --profile bridge up  # real robot, bridge + camera here | interface
#   docker compose --profile real up    # real robot, bridge elsewhere: camera | interface
#
# Settings (robot address, mDNS, domain ID, camera) live in .env; see .env.example.
# GUI windows need X access for local containers once per login:  xhost +local:docker

# Shared by every container: host networking and IPC are required for DDS
# discovery and shared-memory transport between containers (and for the
# bridge, which receives UDP telemetry from the robot on this machine).
x-ros: &ros
  network_mode: host
  ipc: host
  # PID 1 in a container ignores signals it has no handler for, so `docker compose
  # stop` would SIGKILL ros2 launch after the timeout and no node could send its
  # final zero Twist. A tiny init process forwards the signal instead.
  init: true
  # ros2 launch shuts its nodes down cleanly on SIGINT (Ctrl+C); on SIGTERM it
  # just dies and leaves them to be killed.
  stop_signal: SIGINT

x-gui-env: &gui-env
  DISPLAY: ${DISPLAY:-:0}
  QT_X11_NO_MITSHM: "1"
  XAUTHORITY: /root/.Xauthority

x-gui-volumes: &gui-volumes
  - /tmp/.X11-unix:/tmp/.X11-unix:rw
  - ${XAUTHORITY:-/dev/null}:/root/.Xauthority:ro

# Laptop camera for usb_cam (/user_cam/image_raw) in the driver containers.
# Without a camera set START_CAMERA=false and VIDEO_DEVICE=/dev/null in .env.
x-camera-device: &camera-device ${VIDEO_DEVICE:-/dev/video0}:/dev/video0

x-drivers: &drivers
  <<: *ros
  volumes: *gui-volumes

x-interface: &interface
  <<: *ros
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: fossbot_control_interface:jazzy
  volumes: *gui-volumes
  # No /dev/dri here: render the windows in software instead of failing over to it noisily.
  environment: &interface-env
    <<: *gui-env
    LIBGL_ALWAYS_SOFTWARE: "1"

services:
  # ---- simulation ---------------------------------------------------------
  sim:
    <<: *drivers
    profiles: [sim]
    # Base image: FOSSBotEduSim/build_image.sh or `docker compose build sim-base`.
    build:
      context: .
      dockerfile: docker/Dockerfile.drivers
      args:
        BASE_IMAGE: ros2_fossbot_edu
    image: fossbot_drivers:sim
    shm_size: 1g
    devices:
      - /dev/dri:/dev/dri
      - *camera-device
    environment:
      <<: *gui-env
      ROS_DOMAIN_ID: ${SIM_ROS_DOMAIN_ID:-0}
    command: >
      ros2 launch /drivers/drivers.launch.py robot:=sim
      world:=${SIM_WORLD:-simple_shapes.sdf} start_camera:=${START_CAMERA:-true}

  interface-sim:
    <<: *interface
    profiles: [sim]
    depends_on: [sim]
    environment:
      <<: *interface-env
      ROS_DOMAIN_ID: ${SIM_ROS_DOMAIN_ID:-0}
      # The simulator image limits discovery to this machine; both sides must match.
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    command: >
      ros2 launch fossbot_control_interface interface.launch.py start_camera:=false

  # ---- real robot ---------------------------------------------------------
  # Only ONE bridge per robot may run (on one computer). Use this profile only
  # if nobody else runs the bridge for this robot, and do not also use its run.sh.
  bridge:
    <<: *drivers
    profiles: [bridge]
    # Base image: `docker compose build bridge-base` (fossbot-ros2-bridge checkout).
    build:
      context: .
      dockerfile: docker/Dockerfile.drivers
      args:
        BASE_IMAGE: fossbot_bridge:jazzy
    image: fossbot_drivers:bridge
    devices:
      - *camera-device
    environment:
      <<: *gui-env
      FOSSBOT_HOST: ${FOSSBOT_HOST:-}   # robot hostname or IP, from .env
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-1}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
    command: >
      ros2 launch /drivers/drivers.launch.py robot:=bridge
      start_camera:=${START_CAMERA:-true}

  # The bridge runs on another computer: only the laptop camera here.
  camera:
    <<: *drivers
    profiles: [real]
    build:
      context: .
      dockerfile: docker/Dockerfile.drivers
      args:
        BASE_IMAGE: ros:jazzy
    image: fossbot_drivers:camera
    devices:
      - *camera-device
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-1}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp   # same as the bridge
    command: >
      ros2 launch /drivers/drivers.launch.py robot:=none
      start_camera:=${START_CAMERA:-true}

  interface-real:
    <<: *interface
    profiles: [real, bridge]
    environment:
      <<: *interface-env
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-1}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp   # same as the bridge
    command: >
      ros2 launch fossbot_control_interface interface.launch.py
      use_real_robot:=true start_camera:=false

  # ---- base images of the driver containers (build only) ------------------
  # Build once before the first `up`:  docker compose build sim-base bridge-base
  # The `base` profile is never started; it only keeps these out of `up`.
  sim-base:
    profiles: [base]
    build:
      context: ${FOSSBOT_SIM_DIR:-../Lab_5/FOSSBotEduSim}
    image: ros2_fossbot_edu

  bridge-base:
    profiles: [base]
    build:
      context: ${FOSSBOT_BRIDGE_DIR:-../fossbot-ros2-bridge}
    image: fossbot_bridge:jazzy
